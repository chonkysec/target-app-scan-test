# Name of this GitHub Actions workflow.
name: Semgrep

on:
  # Scan changed files in PRs (diff-aware scanning):
  pull_request: {}

  # Scan on-demand through GitHub Actions interface:
  workflow_dispatch: {}

  # Scan mainline branches.
  # Semgrep findings will NOT block a direct push to main/master.
  push:
    branches:
      - main
      - master

  # Schedule the CI job (this method uses cron syntax):
  schedule:
    - cron: '20 17 * * *' # Sets Semgrep to scan every day at 17:20 UTC.
    # It is recommended to change the schedule to a random time.

permissions:
  contents: read

jobs:
  semgrep:
    # User definable name of this GitHub Actions job.
    name: semgrep/ci

    # If you are self-hosting, change the following `runs-on` value:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    container:
      # A Docker image with Semgrep installed. Do not change this.
      image: semgrep/semgrep:1.174.0@sha256:f1f7b71861c7b28b6e0f661225a2c4f58a484f5d0f182465c6d6b3b22f972ade

    # Skip any PR created by dependabot to avoid permission issues:
    if: (github.actor != 'dependabot[bot]')

    steps:
      - name: Require SEMGREP_APP_TOKEN
        run: |
          if [ -z "$SEMGREP_APP_TOKEN" ]; then
            echo "ERROR!!! No SEMGREP_APP_TOKEN is set."
            exit 1
          fi
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      # Fetch project source with GitHub Actions Checkout.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      # Run Semgrep CI.
      #
      # Direct push to main/master:
      #   exit code 1 is allowed, so the workflow still passes.
      #
      # Pull request:
      #   exit code 1 fails the workflow and can block the merge.
      - name: Run Semgrep
        continue-on-error: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        run: semgrep ci
        env:
          # Connect to Semgrep AppSec Platform through your SEMGREP_APP_TOKEN.
          # Generate a token from Semgrep AppSec Platform > Settings
          # and add it to your GitHub secrets.
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Run Semgrep
        continue-on-error: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        run: semgrep ci --no-suppress-errors
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      # ------------------------------------------------------------------
      # ALTERNATIVE: fail open on scanner failure, with an alert instead.
      #
      # Current behaviour (above) is fail OPEN: https://docs.semgrep.dev/release-notes/july-2025
      # We cannot know if the scanner is failing or not if the pipeline is running.
      # We cannot fail the pipeline because of operation so we need to add notification when the scanner itself is getting error.
      # that was a real finding or the scanner not running at all.
      #
      # The version below separates those two cases:
      #   exit 0      clean               -> pass
      #   exit 1      blocking finding    -> FAIL (this is the gate)
      #   otherwise   scanner error       -> pass, but alert the team
      #
      # Chosen against for now: a payments codebase would rather block a
      # merge it cannot scan than ship one it did not. Kept here because
      # the trade is worth revisiting once we know the real scan-failure
      # rate across 120 repositories.
